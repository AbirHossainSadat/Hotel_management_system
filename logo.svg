<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Premium Golden Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#FFDF00"/>
    </linearGradient>
    
    <!-- Subtle Shadow Effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Background Badge Container -->
  <rect width="500" height="500" rx="40" fill="#0A192F"/>

  <!-- Outer Luxury Crest Ring -->
  <circle cx="250" cy="210" r="150" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="250" cy="210" r="140" fill="none" stroke="url(#goldGradient)" stroke-width="2" filter="url(#shadow)"/>

  <!-- Luxury Crown Element -->
  <path d="M 200 130 L 220 150 L 250 115 L 280 150 L 300 130 L 290 170 L 210 170 Z" fill="url(#goldGradient)" filter="url(#shadow)"/>
  <circle cx="200" cy="125" r="4" fill="url(#goldGradient)"/>
  <circle cx="250" cy="110" r="5" fill="url(#goldGradient)"/>
  <circle cx="300" cy="125" r="4" fill="url(#goldGradient)"/>

  <!-- Monogram Letter 'A' -->
  <path d="M 250 185 L 205 280 L 225 280 L 236 255 L 264 255 L 275 280 L 295 280 Z M 250 220 L 259 242 L 241 242 Z" fill="url(#goldGradient)" filter="url(#shadow)"/>

  <!-- 5 Stars Rating Icon -->
  <g fill="url(#goldGradient)" opacity="0.9" transform="translate(0, 15)">
    <polygon points="190,305 193,313 201,313 194,318 197,326 190,321 183,326 186,318 179,313 187,313"/>
    <polygon points="220,305 223,313 231,313 224,318 227,326 220,321 213,326 216,318 209,313 217,313"/>
    <polygon points="250,301 253,309 261,309 254,314 257,322 250,317 243,322 246,314 239,309 247,309"/>
    <polygon points="280,305 283,313 291,313 284,318 287,326 280,321 273,326 276,318 269,313 277,313"/>
    <polygon points="310,305 313,313 321,313 314,318 317,326 310,321 303,326 306,318 299,313 307,313"/>
  </g>

  <!-- Hotel Brand Title -->
  <text x="250" y="380" font-family="'Playfair Display', 'Times New Roman', serif" font-size="32" font-weight="bold" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="4" filter="url(#shadow)">
    AHMANI
  </text>
  
  <text x="250" y="410" font-family="'Poppins', 'Arial', sans-serif" font-size="16" font-weight="500" fill="#CBD5E1" text-anchor="middle" letter-spacing="8" opacity="0.8">
    HOTEL &amp; RESORT
  </text>
  
  <!-- Decorative Bottom Line -->
  <line x1="200" y1="430" x2="300" y2="430" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.7"/>
</svg>
